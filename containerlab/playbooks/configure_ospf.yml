- name: Configure FRR OSPF via templated config, applied directly via vtysh
  hosts: frr
  gather_facts: false
  tasks:
    - name: Render frr.conf
      ansible.builtin.template:
        src: templates/frr.conf.j2
        dest: /tmp/frr-target.conf
        mode: '0644'

    - name: Get current OSPF running-config
      ansible.builtin.command:
        cmd: vtysh -c "show running-config"
      register: current_config
      changed_when: false

    - name: Apply target config only if router ospf block is missing
      ansible.builtin.command:
        cmd: vtysh -f /tmp/frr-target.conf
      when: "'router ospf' not in current_config.stdout"
      register: apply_result
      changed_when: apply_result is not skipped
